<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cotizador PRO - ECO BOXES</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    :root { --primary: #085041; --secondary: #1D9E75; --accent: #ba7517; --bg: #f4f7f6; --surface: #ffffff; --text: #2d3748; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; line-height: 1.5; }
    .container { max-width: 900px; margin: auto; background: var(--surface); padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
    h1 { color: var(--primary); font-size: 24px; margin: 0 0 5px 0; border-bottom: 3px solid var(--secondary); display: inline-block; padding-bottom: 5px; }
    p.subtitle { color: #718096; font-size: 14px; margin: 5px 0 30px 0; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
    .section { background: #fdfdfd; border: 1px solid #e2e8f0; padding: 25px; border-radius: 12px; margin-bottom: 25px; transition: all 0.3s ease; }
    .section-title { font-size: 15px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; color: var(--primary); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
    
    label { font-size: 13px; font-weight: 600; color: #4a5568; display: block; margin-bottom: 6px; }
    input[type="number"] { width: 100%; padding: 12px; border: 1px solid #cbd5e0; border-radius: 8px; font-size: 15px; box-sizing: border-box; transition: border 0.2s; }
    input[type="number"]:focus { outline: none; border-color: var(--secondary); box-shadow: 0 0 0 3px rgba(29, 158, 117, 0.15); }
    
    .checkbox-wrap { display: flex; align-items: center; gap: 12px; padding: 12px; background: #f7fafc; border-radius: 8px; border: 1px dashed #cbd5e0; margin-top: 15px; }
    .checkbox-wrap input { width: 18px; height: 18px; accent-color: var(--secondary); cursor: pointer; }
    .checkbox-wrap label { margin: 0; cursor: pointer; font-size: 14px; }

    .audit-panel { background: #1a202c; color: #e2e8f0; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 13px; margin-top: 15px; line-height: 1.6; }
    .audit-panel span.success { color: #48bb78; }
    .audit-panel span.warning { color: #ecc94b; }
    .audit-panel span.error { color: #fc8181; }

    .result-card { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; padding: 25px; border-radius: 12px; text-align: center; margin-bottom: 20px; box-shadow: 0 10px 20px rgba(29, 158, 117, 0.2); }
    .price-big { font-size: 42px; font-weight: 800; letter-spacing: -1px; margin: 10px 0; }
    
    .btn { padding: 14px 24px; border-radius: 8px; font-weight: 600; font-size: 15px; cursor: pointer; transition: transform 0.1s, opacity 0.2s; border: none; text-align: center; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--secondary); color: white; width: 100%; margin-top: 15px; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-pdf { background: #E53E3E; color: white; flex: 1; }
    .btn-wp { background: #38A169; color: white; flex: 1; }
    
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="container">
  <h1>ECO BOXES PACKAGING SAS</h1>
  <p class="subtitle">Motor de Cotización de Empaques B2B · Análisis Estructural y Financiero</p>

  <!-- SECCIÓN 1 -->
  <div class="section">
    <div class="section-title">📦 1. Ingeniería del Empaque (Medidas Internas)</div>
    <div class="grid">
      <div><label>Largo (cm)</label><input type="number" id="largo" placeholder="Ej: 50" onchange="calcularTodo()"></div>
      <div><label>Ancho (cm)</label><input type="number" id="ancho" placeholder="Ej: 30" onchange="calcularTodo()"></div>
      <div><label>Alto (cm)</label><input type="number" id="alto" placeholder="Ej: 30" onchange="calcularTodo()"></div>
      <div><label>Peso del producto (kg)</label><input type="number" id="peso" value="5" step="0.5" onchange="calcularTodo()"></div>
    </div>
    <div class="checkbox-wrap">
      <input type="checkbox" id="chk-apila" onchange="calcularTodo()" checked>
      <label for="chk-apila"><strong>El cliente va a apilar las cajas</strong> (Multiplica la exigencia estructural por 4 para evitar colapsos).</label>
    </div>
  </div>

  <!-- SECCIÓN 2 -->
  <div class="section hidden" id="sec-auditoria">
    <div class="section-title">🧠 2. Transparencia de Selección de Lámina</div>
    <div id="audit-log" class="audit-panel"></div>
  </div>

  <!-- SECCIÓN 3 -->
  <div class="section hidden" id="sec-finanzas">
    <div class="section-title">💰 3. Parámetros Financieros</div>
    <div class="grid">
      <div><label>Cantidad Solicitada</label><input type="number" id="cantidad" value="500" onchange="calcularTodo()"></div>
      <div><label>Margen Estratégico (%)</label><input type="number" id="margen" value="35.5" step="0.1" onchange="calcularTodo()"></div>
      <div><label>Costo M.O. y Máquina ($)</label><input type="number" id="mano-obra" onchange="calcularTodo()"></div>
    </div>
    
    <div class="checkbox-wrap" style="margin-top:20px;">
      <input type="checkbox" id="chk-imp" onchange="toggleImpresion()">
      <label for="chk-imp">Incluir placa de impresión Flexográfica (Clisé)</label>
    </div>
    <div id="blk-imp" class="grid hidden" style="margin-top:15px; padding-left:45px;">
      <div><label>Costo Proveedor Clisé ($)</label><input type="number" id="in-placa" value="85000" onchange="calcularTodo()"></div>
      <div><label>N° de Tintas</label><input type="number" id="in-tintas" value="1" onchange="calcularTodo()"></div>
    </div>
  </div>

  <!-- SECCIÓN 4 -->
  <div class="section hidden" id="sec-resultado">
    <div class="section-title">📊 4. Resultado de Cotización</div>
    <div id="res-financiero"></div>
  </div>

</div>

<script>
const MATS = [
  { g: 'micro', label: 'Microcorrugado', maxkg: 3, ect: 300, calibre: 0.0015,
    lams: [{ d: [70, 111], p: 3150 }, { d: [200, 100], p: 7750 }, { d: [200, 120], p: 9400 }, { d: [200, 140], p: 12150 }] },
  { g: '620', label: 'Corrugado 620', maxkg: 15, ect: 551, calibre: 0.00416,
    lams: [{ d: [90, 70 ], p: 3400 }, { d: [89, 90 ], p: 4400 }, { d: [146, 60 ], p: 4350 }, { d: [105, 106], p: 5100 },
           { d: [146, 90 ], p: 5400 }, { d: [140, 106], p: 6050 }, { d: [120, 119], p: 7000 }, { d: [200, 100], p: 8400 },
           { d: [106, 106], p: 8800 }, { d: [150, 150], p: 8800 }, { d: [245, 110], p: 9800 }, { d: [200, 120], p: 10400 },
           { d: [245, 90 ], p: 10600 }, { d: [200, 140], p: 11800 }, { d: [220, 120], p: 12400 }, { d: [230, 150], p: 12600 }, { d: [245, 185], p: 18450 }] },
  { g: '720', label: 'Corrugado 720 (Reforzado)', maxkg: 25, ect: 700, calibre: 0.0042,
    lams: [{ d: [245, 185], p: 22300 }] },
  { g: 'doble', label: 'Doble Pared', maxkg: 50, ect: 1130, calibre: 0.007,
    lams: [{ d: [91, 91 ], p: 7500 }, { d: [106, 106], p: 10000 }, { d: [245, 111], p: 20450 }, { d: [245, 185], p: 31200 }] }
];

let selLam = null, curL=0, curA=0, curH=0, precioFinal=0, cantFinal=0, bctCalculado=0;
const IVA = 0.19;

function toggleImpresion() {
  document.getElementById('blk-imp').classList.toggle('hidden');
  calcularTodo();
}

function calcularTodo() {
  curL = parseFloat(document.getElementById('largo').value) || 0;
  curA = parseFloat(document.getElementById('ancho').value) || 0;
  curH = parseFloat(document.getElementById('alto').value) || 0;
  let pesoReal = parseFloat(document.getElementById('peso').value) || 0;
  let apila = document.getElementById('chk-apila').checked;
  
  if (!curL || !curA || !curH) return;

  // REGLAS TÉCNICAS
  let pesoEf = apila ? (pesoReal * 4) : pesoReal;
  let devBaseW = Math.round((2 * (curL + curA) * 10) + 35); // 35mm pestaña
  let devBaseH = Math.round((curH + curA) * 10) + 10; // 10mm tolerancia doblez

  let logHtml = `> Iniciando cálculo geométrico...<br>`;
  logHtml += `> Desarrollo Plano (corte): ${devBaseW}mm Ancho x ${devBaseH}mm Alto.<br>`;
  logHtml += `> Peso base: ${pesoReal}kg. Factor apilamiento: ${apila ? 'Activado (x4)' : 'Inactivo (x1)'} -> Exigencia real: <span class="warning">${pesoEf}kg</span>.<br><br>`;

  let opcionesValidas = [];

  MATS.forEach(mat => {
    if (pesoEf > mat.maxkg) {
      logHtml += `<span class="error">[X] Descartado ${mat.label}:</span> Soporta máximo ${mat.maxkg}kg.<br>`;
      return;
    }
    
    // Ajuste pestaña/doblez si es doble pared
    let isDoble = mat.g === 'doble';
    let devW = Math.round((2 * (curL + curA) * 10) + (isDoble ? 40 : 35));
    let devH = Math.round((curH + curA) * 10) + (isDoble ? 15 : 10);
    
    let mejorLaminaMat = null;
    mat.lams.forEach(item => {
      let lW = item.d[0] * 10, lH = item.d[1] * 10;
      let cajas = Math.floor(lW / devW) * Math.floor(lH / devH); // Flauta estricta
      if (cajas < 1) return;
      
      let costoInterno = (item.p / (1 + IVA)) * 0.90; 
      let costoCaja = costoInterno / cajas;
      
      if(!mejorLaminaMat || costoCaja < mejorLaminaMat.porcaja) {
        mejorLaminaMat = { ...mat, w: item.d[0], h: item.d[1], cajas, costoInterno, porcaja: costoCaja, m2: (devW/1000)*(devH/1000) };
      }
    });

    if(mejorLaminaMat) {
      opcionesValidas.push(mejorLaminaMat);
      logHtml += `<span class="success">[✓] Aprobado ${mat.label}:</span> Salen ${mejorLaminaMat.cajas} cajas en lámina ${mejorLaminaMat.w}x${mejorLaminaMat.h}. Costo M.P: $${Math.round(mejorLaminaMat.porcaja)}/caja.<br>`;
    }
  });

  if (opcionesValidas.length === 0) {
    document.getElementById('audit-log').innerHTML = logHtml + `<br><span class="error">CRÍTICO: Ningún material soporta esta configuración técnica.</span>`;
    return;
  }

  // Elegir la más barata
  opcionesValidas.sort((a,b) => a.porcaja - b.porcaja);
  selLam = opcionesValidas[0];
  
  logHtml += `<br>> <span class="success">SISTEMA ELIGE: ${selLam.label} de ${selLam.w}x${selLam.h}cm por ser la opción estructuralmente segura de menor costo.</span>`;
  document.getElementById('audit-log').innerHTML = logHtml;

  // Setear MO base automáticamente (150 fijo + 200/m2)
  if(!document.getElementById('mano-obra').dataset.modificado) {
    document.getElementById('mano-obra').value = Math.round(150 + (selLam.m2 * 200));
  }

  // CALCULAR FINANZAS
  cantFinal = parseInt(document.getElementById('cantidad').value) || 300;
  let mg = parseFloat(document.getElementById('margen').value) || 30;
  let mo = parseFloat(document.getElementById('mano-obra').value) || 0;
  
  let costoPlaca = 0;
  if(document.getElementById('chk-imp').checked) {
    let placa = parseFloat(document.getElementById('in-placa').value) || 0;
    let tintas = parseInt(document.getElementById('in-tintas').value) || 1;
    costoPlaca = Math.round((placa * 1.10 * tintas) / cantFinal); // 10% margen placa
  }

  let costoProduccion = selLam.porcaja + mo + (selLam.g === 'doble' ? 50 : 30);
  let precioNeto = costoProduccion / (1 - (mg / 100));
  precioFinal = Math.round((precioNeto + costoPlaca) * (1 + IVA));
  bctCalculado = Math.round(5.876 * selLam.ect * Math.sqrt(selLam.calibre * (2 * (curL + curA) / 100)));

  // MOSTRAR INTERFAZ
  ['sec-auditoria', 'sec-finanzas', 'sec-resultado'].forEach(id => document.getElementById(id).classList.remove('hidden'));

  document.getElementById('res-financiero').innerHTML = `
    <div class="result-card">
      <div style="font-size:14px; text-transform:uppercase; letter-spacing:1px; opacity:0.9;">Precio Unitario al Cliente (IVA Incluido)</div>
      <div class="price-big">$${precioFinal.toLocaleString('es-CO')}</div>
      <div style="font-size:16px; font-weight:600;">Pedido total: $${(precioFinal * cantFinal).toLocaleString('es-CO')}</div>
      <div style="font-size:13px; margin-top:10px; opacity:0.8;">Caja RSC en ${selLam.label} | BCT: ${bctCalculado} kg</div>
    </div>
    <div style="display:flex; gap:15px;">
      <button class="btn btn-pdf" onclick="generarPDF()">📄 Exportar PDF Formal</button>
      <button class="btn btn-wp" onclick="copiarWP()">💬 Copiar para WhatsApp</button>
    </div>
  `;
}

// Controlar si el usuario modifica la M.O. a mano para no sobreescribirla
document.getElementById('mano-obra').addEventListener('input', function() { this.dataset.modificado = "true"; });

function generarPDF() {
  const element = document.createElement('div');
  element.innerHTML = `
    <div style="padding: 50px; font-family: 'Segoe UI', Arial, sans-serif; color: #2d3748;">
      
      <!-- CABECERA CORPORATIVA -->
      <div style="display: flex; justify-content: space-between; border-bottom: 4px solid #085041; padding-bottom: 25px; margin-bottom: 35px;">
        <div>
          <h1 style="color: #085041; margin: 0; font-size: 32px; letter-spacing: -1px;">ECO BOXES PACKAGING</h1>
          <p style="margin: 8px 0 0 0; font-size: 14px; color: #718096; font-weight: 600;">SOLUCIONES ESTRUCTURALES EN CARTÓN CORRUGADO</p>
          <p style="margin: 4px 0 0 0; font-size: 13px; color: #718096;">Bogotá, Colombia</p>
        </div>
        <div style="text-align: right; border-left: 2px solid #e2e8f0; padding-left: 20px;">
          <h2 style="margin: 0; font-size: 22px; color: #ba7517; text-transform: uppercase;">Propuesta Comercial</h2>
          <p style="margin: 5px 0 0 0; font-size: 14px;">Emisión: <strong>${new Date().toLocaleDateString('es-CO')}</strong></p>
          <p style="margin: 2px 0 0 0; font-size: 14px;">Validez: <strong>7 días calendario</strong></p>
        </div>
      </div>

      <!-- INGENIERÍA Y ESPECIFICACIONES -->
      <h3 style="color: #085041; font-size: 16px; margin-bottom: 15px; border-bottom: 1px solid #cbd5e0; padding-bottom: 5px;">I. FICHA TÉCNICA DEL EMPAQUE</h3>
      <table style="width: 100%; border-collapse: collapse; margin-bottom: 35px; font-size: 13px;">
        <tr style="background: #f7fafc;"><td style="padding: 10px; font-weight: 700; width: 35%; border: 1px solid #e2e8f0;">Diseño Estructural:</td><td style="padding: 10px; border: 1px solid #e2e8f0;">Caja Regular (RSC) de 4 aletas. Flauta Vertical.</td></tr>
        <tr><td style="padding: 10px; font-weight: 700; border: 1px solid #e2e8f0;">Dimensiones Internas (LxAxH):</td><td style="padding: 10px; border: 1px solid #e2e8f0;">${curL} x ${curA} x ${curH} cm</td></tr>
        <tr style="background: #f7fafc;"><td style="padding: 10px; font-weight: 700; border: 1px solid #e2e8f0;">Material Designado:</td><td style="padding: 10px; border: 1px solid #e2e8f0;">${selLam.label}</td></tr>
        <tr><td style="padding: 10px; font-weight: 700; border: 1px solid #e2e8f0;">Resistencia a la Compresión (BCT):</td><td style="padding: 10px; border: 1px solid #e2e8f0;">${bctCalculado.toLocaleString('es-CO')} kg de carga estática (Cálculo McKee).</td></tr>
      </table>

      <!-- INVERSIÓN -->
      <h3 style="color: #085041; font-size: 16px; margin-bottom: 15px; border-bottom: 1px solid #cbd5e0; padding-bottom: 5px;">II. ESTRUCTURA DE INVERSIÓN</h3>
      <table style="width: 100%; border-collapse: collapse; font-size: 14px; margin-bottom: 45px;">
        <tr style="background: #085041; color: white;">
          <th style="padding: 12px; text-align: left; border: 1px solid #085041;">Concepto</th>
          <th style="padding: 12px; text-align: center; border: 1px solid #085041;">Volumen</th>
          <th style="padding: 12px; text-align: right; border: 1px solid #085041;">V. Unitario (IVA inc)</th>
          <th style="padding: 12px; text-align: right; border: 1px solid #085041;">Subtotal Total (IVA inc)</th>
        </tr>
        <tr>
          <td style="padding: 15px 12px; border: 1px solid #e2e8f0; font-weight: 500;">Fabricación de Empaque RSC</td>
          <td style="padding: 15px 12px; border: 1px solid #e2e8f0; text-align: center;">${cantFinal.toLocaleString('es-CO')} und.</td>
          <td style="padding: 15px 12px; border: 1px solid #e2e8f0; text-align: right; color: #1D9E75; font-weight: 700;">$${precioFinal.toLocaleString('es-CO')}</td>
          <td style="padding: 15px 12px; border: 1px solid #e2e8f0; text-align: right; font-weight: 700;">$${(precioFinal * cantFinal).toLocaleString('es-CO')}</td>
        </tr>
      </table>

      <!-- TÉRMINOS LEGALES Y LOGÍSTICOS -->
      <h3 style="color: #085041; font-size: 16px; margin-bottom: 10px; border-bottom: 1px solid #cbd5e0; padding-bottom: 5px;">III. POLÍTICAS COMERCIALES Y LOGÍSTICAS</h3>
      <div style="background: #f7fafc; border: 1px solid #e2e8f0; padding: 20px; border-radius: 8px;">
        <ul style="font-size: 12px; color: #4a5568; line-height: 1.6; margin: 0; padding-left: 20px;">
          <li style="margin-bottom: 6px;"><strong>Forma de pago:</strong> 50% de anticipo para orden de trabajo, 50% saldo contra entrega (Valores cotizados son antes de retenciones de ley).</li>
          <li style="margin-bottom: 6px;"><strong>Tolerancia de Producción (Industria Corrugadora):</strong> La cantidad final facturada y entregada tiene un margen de fluctuación de +/- 10% por mermas en calibración (Overrun/Underrun).</li>
          <li style="margin-bottom: 6px;"><strong>Bodegaje:</strong> El cliente dispone de cinco (5) días hábiles para retirar o recibir la mercancía. A partir del día 6 se causará un cargo de $15.000 COP diarios por estiba ocupada.</li>
          <li style="margin-bottom: 6px;"><strong>Despachos:</strong> Envío sin costo en Bogotá sujeto a cumplimiento de volumen mínimo para ocupación de furgón NHR. Pedidos inferiores aplican tarifa de flete a convenir.</li>
          <li><strong>Pre-Prensa y Clisé:</strong> El arte gráfico debe ser entregado en curvas (Vectorizado). Procesos de re-dibujo por logos pixelados serán facturados adicionalmente. La propiedad del clisé físico pertenece al cliente tras su fabricación.</li>
        </ul>
      </div>

      <div style="margin-top: 50px; text-align: center; font-size: 11px; color: #a0aec0; border-top: 1px solid #e2e8f0; padding-top: 20px;">
        Cotización generada a través del módulo de ingeniería de ECO BOXES PACKAGING SAS.
      </div>
    </div>`;

  html2pdf().set({ 
    margin: [0, 0, 0, 0], 
    filename: `ECOBOXES_Cotizacion_${curL}x${curA}x${curH}.pdf`, 
    image: { type: 'jpeg', quality: 1 }, 
    html2canvas: { scale: 2, useCORS: true }, 
    jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' } 
  }).from(element).save();
}

function copiarWP() {
  const txt = `*ECO BOXES PACKAGING* 📦\nPropuesta Comercial\n\n📌 *Ficha Técnica*\nCaja Regular RSC (${curL}x${curA}x${curH} cm)\nMaterial: ${selLam.label} (BCT: ${bctCalculado}kg)\nCantidad: ${cantFinal.toLocaleString('es-CO')} unidades.\n\n💰 *Inversión*\nPrecio Unitario: *$${precioFinal.toLocaleString('es-CO')}* (IVA incluido)\nTotal: *$${(precioFinal * cantFinal).toLocaleString('es-CO')}*\n\n_Cotización válida por 7 días. Pago 50/50. Sujeto a tolerancias de producción industrial (+/- 10%)._`;
  navigator.clipboard.writeText(txt).then(() => alert('¡Texto copiado para enviar por WhatsApp!'));
}
</script>
</body>
</html>
